<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Fons fosquet arrodonit que ocupa tot el quadrat -->
  <rect width="100" height="100" rx="22" fill="#0f172a" />
  
  <!-- Orbitals atòmics gruixuts en alta definició -->
  <ellipse cx="50" cy="50" rx="39" ry="15" fill="none" stroke="#38bdf8" stroke-width="5" transform="rotate(0 50 50)" />
  <ellipse cx="50" cy="50" rx="39" ry="15" fill="none" stroke="#f59e0b" stroke-width="5" transform="rotate(60 50 50)" />
  <ellipse cx="50" cy="50" rx="39" ry="15" fill="none" stroke="#38bdf8" stroke-width="5" transform="rotate(120 50 50)" />
  
  <!-- Nucli atòmic destacat -->
  <circle cx="50" cy="50" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
  
  <!-- Número 8 (Regla de l'Octet) centrat al nucli -->
  <text x="50" y="50" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle" dominant-baseline="central">8</text>
</svg>